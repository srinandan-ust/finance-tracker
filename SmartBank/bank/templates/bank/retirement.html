{% extends "bank/base.html" %}

{% block content %}
  <h2>Retirement Corpus Estimation</h2>
  <form method="post">
    {% csrf_token %}
    <label for="savings">Current Savings:</label>
    <input type="number" name="savings" id="savings" required step="0.01">
    <label for="contribution">Monthly Contribution:</label>
    <input type="number" name="contribution" id="contribution" required step="0.01">
    <label for="rate">Expected Rate of Return (% per annum):</label>
    <input type="number" name="rate" id="rate" required step="0.01">
    <label for="years">Duration (years):</label>
    <input type="number" name="years" id="years" required>
    <button type="submit">Estimate Corpus</button>
  </form>

  {% if corpus %}
    <p>Your estimated retirement corpus is ₹{{ corpus }}</p>
  {% endif %}
  
  <a href="{% url 'dashboard' %}">Back to Dashboard</a>
{% endblock %}
