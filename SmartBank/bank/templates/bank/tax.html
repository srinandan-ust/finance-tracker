{% extends "bank/base.html" %}
{%block content%}
  <div class="container mt-5">
    <h2>Taxable Income Estimator</h2>

    <!-- Form for submitting gross income and deductions -->
    <form method="POST" action="{% url 'tax' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="gross_income">Gross Income </label>
        <input type="number" name="gross_income" step="0.01" placeholder="Enter gross income" class="form-control mb-2" required>
      </div>

      <div class="form-group">
        <label for="deductions">Deductions </label>
        <input type="number" name="deductions" step="0.01" placeholder="Enter deductions" class="form-control mb-2" required>
      </div>

      <button type="submit" class="btn btn-primary">Calculate Taxable Income</button>
    </form>

    <!-- Display the results or an error message -->
    {% if taxable_income is not None %}
      <div class="alert alert-success mt-4">
        <h4>Calculated Taxable Income:</h4>
        <p>₹{{ taxable_income|floatformat:2 }}</p>
      </div>
    {% elif error_message %}
      <div class="alert alert-danger mt-4">
        {{ error_message }}
      </div>
    {% endif %}

    <!-- Back to Dashboard link -->
    <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
  </div>
{% endblock %}
