<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartBank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        .btn-block {
            width: 100%;
            margin-bottom: 15px;
        }
        .section {
            margin-top: 40px;
        }
        .navbar-brand {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Zest Finance</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item"><a class="nav-link" href="{% url 'emi' %}">EMI Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'sip' %}">SIP Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'fd' %}">FD Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'rd' %}">RD Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'retirement' %}">Retirement Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home_loan' %}">Home Loan</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'credit_card' %}">Credit Card Estimator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tax' %}">Tax Estimator</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'budget' %}">Budget Planner</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'net_worth' %}">Net Worth</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right btn btn-danger"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main content area -->
<div class="container mt-4">
  {% block content %}
  <!-- Child templates will inject content here -->
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
