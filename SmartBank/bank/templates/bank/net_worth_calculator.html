{% extends 'bank/base.html' %}

{% block content %}
  <div class="container mt-5">
    <h2>Net Worth Calculator</h2>
    <form method="POST" action="{% url 'net_worth' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="assets" class="form-label">Assets </label>
        <input type="number" class="form-control" id="assets" name="assets" required>
      </div>
      <div class="mb-3">
        <label for="liabilities" class="form-label">Liabilities </label>
        <input type="number" class="form-control" id="liabilities" name="liabilities" required>
      </div>
      <button type="submit" class="btn btn-primary">Calculate Net Worth</button>
    </form>

    {% if net_worth %}
      <div class="mt-3 alert alert-info">
        <strong>Net Worth:</strong> ₹{{ net_worth }}
      </div>
    {% endif %}
  </div>
   <!-- Back to Dashboard link -->
   <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
{% endblock %}
