{% extends 'bank/base.html' %}

{% block content %}
  <div class="container mt-5">
    <h2>Taxable Income Calculator</h2>
    <form method="POST" action="{% url 'calculate_taxable_income' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="gross_income" class="form-label">Gross Income ($)</label>
        <input type="number" class="form-control" id="gross_income" name="gross_income" required>
      </div>
      <div class="mb-3">
        <label for="deductions" class="form-label">Deductions ($)</label>
        <input type="number" class="form-control" id="deductions" name="deductions" required>
      </div>
      <button type="submit" class="btn btn-primary">Calculate Taxable Income</button>
    </form>

    {% if taxable_income %}
      <div class="mt-3 alert alert-info">
        <strong>Taxable Income:</strong> ${{ taxable_income }}
      </div>
    {% endif %}
  </div>
{% endblock %}
